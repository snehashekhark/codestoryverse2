# Netlify Configuration for Code Monsoon
[build]
  # We publish the codes directory directly as it contains the self-contained production bundle
  publish = "codes"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
